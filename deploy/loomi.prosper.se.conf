# ============================================================
# naas.prosper.se — nginx reverse proxy for loomi.prosper.se
# Replaces /etc/nginx/conf.d/loomi.prosper.se.conf (adds the
# /ws WebSocket upgrade and the /music stream passthrough —
# only ports 80/443 pass the cloud firewall, so both must ride
# through this vhost).
#
# Install:
#   sudo tee /etc/nginx/conf.d/loomi.prosper.se.conf < deploy/loomi.prosper.se.conf
#   sudo nginx -t && sudo nginx -s reload
# ============================================================
upstream loomi {
    server 127.0.0.1:8083;
}

server {
    listen 80;
    server_name loomi.prosper.se;

    client_max_body_size 1000M;
    proxy_read_timeout 36000s;
    proxy_redirect off;

    # Lobby WebSocket (headers must be forwarded or the handshake dies)
    location /ws {
        proxy_pass http://loomi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 36000s;
    }

    # Level editor (static container on127.0.0.1:8084)
    location = /editor {
        return 301 /editor/;
    }

    location /editor/ {
        proxy_pass http://127.0.0.1:8084/;
        proxy_set_header Host $host;
        client_max_body_size 100m;
    }

    # Music stream (mixed server-side by LoomiMusicMixServer on:4001;
    # no trailing slash on proxy_pass keeps the /music prefix)
    location /music/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://loomi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}
